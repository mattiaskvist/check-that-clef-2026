[project]
name = "clef-demo"
version = "0.1.0"
description = "CLEF demo package"
requires-python = ">=3.11"
dependencies = [
    "clef-pipeline",
    "streamlit>=1.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
clef-pipeline = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["clef_demo"]
