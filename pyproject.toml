[project]
name = "check-that-clef-2026"
version = "1.0.0"
description = "CLEF 2026 CheckThat source retrieval pipeline, demo, and BGE fine-tuning workspace"
readme = "README.md"
authors = [
    {name = "Mattias Kvist", email = "mattias.kvist@telia.com"},
    {name = "Eduardo Nazario", email = "edfnazario@gmail.com"},
    {name = "dsuzener"},
    {name = "Osvald Svaenus", email = "osvalds@kth.se"},
]
requires-python = ">=3.11"
dependencies = [
    "clef-demo",
    "clef-pipeline",
    "clef-training",
    "datasets>=4.8.4",
    "deep-translator>=1.9.1",
    "dotenv>=0.9.9",
    "google>=3.0.0",
    "httpx<0.28.0",
    "huggingface-hub>=1.7.2",
    "ipykernel>=7.2.0",
    "modal>=1.4.1",
    "nltk>=3.9.4",
    "numpy>=2.4.3",
    "ollama>=0.6.1",
    "peft>=0.18.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "scholarly>=1.7.11",
    "scikit-learn>=1.6.0",
    "sentence-transformers>=5.3.0",
    "streamlit>=1.50.0",
    "torch>=2.11.0",
    "transformers>=5.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.7",
]

[tool.uv.workspace]
members = [
    "src/clef_pipeline",
    "src/clef_demo",
    "src/clef_training",
]

[tool.uv.sources]
clef-pipeline = { workspace = true }
clef-demo = { workspace = true }
clef-training = { workspace = true }
