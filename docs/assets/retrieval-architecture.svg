<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval pipeline architecture</title>
  <desc id="desc">Documents and tweets are preprocessed, passed through sparse and dense retrievers, fused, and reranked.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .large { font-size: 22px; }
      .medium { font-size: 16px; }
      .box-blue { fill: #176985; stroke: #0a4258; stroke-width: 2; }
      .box-cyan { fill: #1fa6d3; stroke: #0a6f91; stroke-width: 2; }
      .box-orange { fill: #ef6c2d; stroke: #9d3e12; stroke-width: 2; }
      .box-green { fill: #176f25; stroke: #0b3f14; stroke-width: 2; }
      .arrow { stroke: #111111; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="260" fill="#ffffff"/>

  <rect class="box-blue" x="0" y="25" width="155" height="65"/>
  <text class="label large" x="77.5" y="57.5">Documents</text>

  <rect class="box-blue" x="0" y="170" width="155" height="65"/>
  <text class="label large" x="77.5" y="202.5">Tweets</text>

  <rect class="box-cyan" x="205" y="40" width="130" height="45"/>
  <text class="label medium" x="270" y="62.5">Preprocessing</text>

  <rect class="box-cyan" x="205" y="185" width="130" height="45"/>
  <text class="label medium" x="270" y="207.5">Preprocessing</text>

  <rect class="box-orange" x="385" y="5" width="215" height="90"/>
  <text class="label large" x="492.5" y="50">Sparse Retriever</text>

  <rect class="box-orange" x="385" y="155" width="215" height="90"/>
  <text class="label large" x="492.5" y="200">Dense Retriever</text>

  <rect class="box-green" x="690" y="105" width="145" height="55"/>
  <text class="label medium" x="762.5" y="132.5">Fusion Method</text>

  <rect class="box-orange" x="940" y="85" width="180" height="90"/>
  <text class="label large" x="1030" y="130">Reranker</text>

  <path class="arrow" d="M155 57.5 H205"/>
  <path class="arrow" d="M155 202.5 H205"/>
  <path class="arrow" d="M335 62.5 H385"/>
  <path class="arrow" d="M335 207.5 H385"/>
  <path class="arrow" d="M600 50 C650 50 650 112 690 125"/>
  <path class="arrow" d="M600 200 C650 200 650 153 690 140"/>
  <path class="arrow" d="M835 132.5 H940"/>
</svg>
